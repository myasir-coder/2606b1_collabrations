
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Section</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #101820;
        }

        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            background: #101820;
            color: white;
            padding: 50px 0;
        }

        .hero h1 {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .hero p {
            color: #cccccc;
            font-size: 17px;
            margin-bottom: 25px;
        }

        .hero img {
            width: 100%;
            height: 350px;
            object-fit: cover;
            border-radius: 15px;
        }

        .hero button {
            padding: 12px 28px;
            font-weight: bold;
        }

        @media(max-width: 768px) {
            .hero h1 {
                font-size: 35px;
            }

            .hero img {
                margin-top: 35px;
            }
        }
    </style>
</head>

<body>

<section class="hero">
    <div class="container">
        <div class="row align-items-center">

            <div class="col-md-6">
                <h1>Welcome to Our Website</h1>

                <p>
                    Discover amazing experiences with our modern

                </p>

                <button class="btn btn-warning">
                    Explore Now
                </button>
            </div>

            <div class="col-md-6">
                <img
                src="https://images.unsplash.com/photo-1497366754035-f200968a6e72"

    </div>
</section>

</body>
</html>
